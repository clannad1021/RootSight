spring:
  application:
    name: root-sight
  datasource:
    # 状态查询不依赖业务库表，因此默认 URL 不绑定某个具体数据库；需要时可用环境变量覆盖。
    url: ${ROOTSIGHT_DB_URL:jdbc:mysql://localhost:3306/?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${ROOTSIGHT_DB_USERNAME:readonly}
    password: ${ROOTSIGHT_DB_PASSWORD:}
    hikari:
      # RootSight 只观察数据库；连接池和只读账号共同限制误写风险。
      read-only: true
      maximum-pool-size: ${ROOTSIGHT_DB_MAX_POOL_SIZE:2}
      minimum-idle: 0
      connection-timeout: ${ROOTSIGHT_DB_CONNECTION_TIMEOUT:3000}
      validation-timeout: ${ROOTSIGHT_DB_VALIDATION_TIMEOUT:2000}
  data:
    redis:
      host: ${ROOTSIGHT_REDIS_HOST:localhost}
      port: ${ROOTSIGHT_REDIS_PORT:6379}
      username: ${ROOTSIGHT_REDIS_USERNAME:rootsight}
      password: ${ROOTSIGHT_REDIS_PASSWORD:}
      database: ${ROOTSIGHT_REDIS_DATABASE:2}
      timeout: 3s
  ai:
    model:
      chat: deepseek
      embedding: openai
      # RootSight 只借用 OpenAI 兼容的 Embedding 接口，不创建无关的图像、语音和审核模型。
      image: none
      audio:
        transcription: none
        speech: none
      moderation: none
    retry:
      # Stage 1A 只做有限重试，避免模型端故障时一个 HTTP 请求长时间占用服务器线程。
      max-attempts: ${ROOTSIGHT_AI_RETRY_MAX_ATTEMPTS:2}
      backoff:
        initial-interval: ${ROOTSIGHT_AI_RETRY_INITIAL_INTERVAL:1s}
        multiplier: ${ROOTSIGHT_AI_RETRY_MULTIPLIER:2}
        max-interval: ${ROOTSIGHT_AI_RETRY_MAX_INTERVAL:3s}
    deepseek:
      # 密钥只从环境变量读取，避免真实凭证进入配置文件和 Git 历史。
      api-key: ${DEEPSEEK_API_KEY}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      chat:
        model: ${DEEPSEEK_CHAT_MODEL:deepseek-v4-flash}
        # 诊断回答优先稳定和可复现，暂时不追求创意性。
        temperature: ${DEEPSEEK_CHAT_TEMPERATURE:0.2}
    openai:
      # 通用连接参数供 Embedding 自动配置读取；密钥仍然只来自环境变量。
      base-url: ${SILICONFLOW_BASE_URL:https://api.siliconflow.cn/v1}
      api-key: ${SILICONFLOW_API_KEY}
      embedding:
        # 硅基流动提供 OpenAI 兼容的 /v1/embeddings。
        # 必须使用普通模型，不能在此处添加 Pro/ 前缀。
        model: BAAI/bge-m3
    vectorstore:
      qdrant:
        host: ${ROOTSIGHT_QDRANT_HOST:127.0.0.1}
        port: ${ROOTSIGHT_QDRANT_GRPC_PORT:6334}
        use-tls: ${ROOTSIGHT_QDRANT_USE_TLS:false}
        collection-name: ${ROOTSIGHT_QDRANT_COLLECTION:rootsight_knowledge}
        content-field-name: content
        # 集合由受保护的启动同步流程创建，避免 Qdrant/Embedding 故障阻止 Agent 启动。
        initialize-schema: false

rootsight:
  target:
    # 当前进程连接的一组基础设施使用一个逻辑名称，后续可演进为多目标配置。
    name: ${ROOTSIGHT_TARGET_NAME:default-target}
  rabbitmq:
    management:
      # RabbitMQ 仅通过 Management HTTP API 读取状态，不建立 AMQP 业务连接。
      url: ${ROOTSIGHT_RABBITMQ_MANAGEMENT_URL:http://127.0.0.1:15672}
      username: ${ROOTSIGHT_RABBITMQ_USERNAME:rootsight_monitor}
      password: ${ROOTSIGHT_RABBITMQ_PASSWORD:}
      vhost: ${ROOTSIGHT_RABBITMQ_VHOST:/}
      queue-page-size: ${ROOTSIGHT_RABBITMQ_QUEUE_PAGE_SIZE:100}
      queue-sample-limit: ${ROOTSIGHT_RABBITMQ_QUEUE_SAMPLE_LIMIT:20}
      connect-timeout: ${ROOTSIGHT_RABBITMQ_CONNECT_TIMEOUT:3s}
      read-timeout: ${ROOTSIGHT_RABBITMQ_READ_TIMEOUT:5s}
  loki:
    # RootSight 只调用查询 API；日志写入由 Alloy 完成。
    url: ${ROOTSIGHT_LOKI_URL:http://127.0.0.1:3100}
    service-label: ${ROOTSIGHT_LOKI_SERVICE_LABEL:service_name}
    default-service: ${ROOTSIGHT_LOKI_DEFAULT_SERVICE:observed-target}
    default-limit: ${ROOTSIGHT_LOKI_DEFAULT_LIMIT:50}
    max-limit: ${ROOTSIGHT_LOKI_MAX_LIMIT:100}
    max-filter-length: ${ROOTSIGHT_LOKI_MAX_FILTER_LENGTH:120}
    max-line-length: ${ROOTSIGHT_LOKI_MAX_LINE_LENGTH:1000}
    default-window: ${ROOTSIGHT_LOKI_DEFAULT_WINDOW:30m}
    expansion-windows:
      - ${ROOTSIGHT_LOKI_EXPANSION_WINDOW_1:2h}
      - ${ROOTSIGHT_LOKI_EXPANSION_WINDOW_2:6h}
      - ${ROOTSIGHT_LOKI_EXPANSION_WINDOW_3:24h}
    fallback-window: ${ROOTSIGHT_LOKI_FALLBACK_WINDOW:168h}
    incident-before: ${ROOTSIGHT_LOKI_INCIDENT_BEFORE:10m}
    incident-after: ${ROOTSIGHT_LOKI_INCIDENT_AFTER:20m}
    context-window: ${ROOTSIGHT_LOKI_CONTEXT_WINDOW:30s}
    context-limit: ${ROOTSIGHT_LOKI_CONTEXT_LIMIT:20}
    connect-timeout: ${ROOTSIGHT_LOKI_CONNECT_TIMEOUT:3s}
    read-timeout: ${ROOTSIGHT_LOKI_READ_TIMEOUT:8s}
  prometheus:
    # RootSight 只调用 Prometheus 查询 API；指标写入由目标应用暴露端点、Prometheus 主动抓取完成。
    url: ${ROOTSIGHT_PROMETHEUS_URL:http://127.0.0.1:9090}
    service-label: ${ROOTSIGHT_PROMETHEUS_SERVICE_LABEL:application}
    default-service: ${ROOTSIGHT_PROMETHEUS_DEFAULT_SERVICE:observed-target}
    default-window: ${ROOTSIGHT_PROMETHEUS_DEFAULT_WINDOW:5m}
    allowed-windows:
      - 1m
      - 5m
      - 15m
      - 30m
      - 1h
    max-service-length: ${ROOTSIGHT_PROMETHEUS_MAX_SERVICE_LENGTH:120}
    query-timeout: ${ROOTSIGHT_PROMETHEUS_QUERY_TIMEOUT:5s}
    connect-timeout: ${ROOTSIGHT_PROMETHEUS_CONNECT_TIMEOUT:3s}
    read-timeout: ${ROOTSIGHT_PROMETHEUS_READ_TIMEOUT:8s}
  knowledge:
    enabled: ${ROOTSIGHT_KNOWLEDGE_ENABLED:true}
    auto-index: ${ROOTSIGHT_KNOWLEDGE_AUTO_INDEX:true}
    source-root: ${ROOTSIGHT_KNOWLEDGE_SOURCE_ROOT:knowledge-base}
    system-name: ${ROOTSIGHT_KNOWLEDGE_SYSTEM_NAME:observed-system}
    include-globs:
      - README.md
      - docs/*.md
      - runbooks/*.md
    exclude-globs:
      - docs/interview*.md
      - docs/*question-bank*.md
    max-source-files: ${ROOTSIGHT_KNOWLEDGE_MAX_SOURCE_FILES:100}
    max-file-size: ${ROOTSIGHT_KNOWLEDGE_MAX_FILE_SIZE:1MB}
    chunk-size: ${ROOTSIGHT_KNOWLEDGE_CHUNK_SIZE:800}
    min-chunk-size-chars: ${ROOTSIGHT_KNOWLEDGE_MIN_CHUNK_SIZE_CHARS:200}
    min-chunk-length-to-embed: ${ROOTSIGHT_KNOWLEDGE_MIN_CHUNK_LENGTH_TO_EMBED:20}
    max-chunks-per-file: ${ROOTSIGHT_KNOWLEDGE_MAX_CHUNKS_PER_FILE:200}
    top-k: ${ROOTSIGHT_KNOWLEDGE_TOP_K:5}
    max-top-k: ${ROOTSIGHT_KNOWLEDGE_MAX_TOP_K:10}
    similarity-threshold: ${ROOTSIGHT_KNOWLEDGE_SIMILARITY_THRESHOLD:0.45}
    max-query-length: ${ROOTSIGHT_KNOWLEDGE_MAX_QUERY_LENGTH:500}
    max-snippet-length: ${ROOTSIGHT_KNOWLEDGE_MAX_SNIPPET_LENGTH:1200}

management:
  health:
    # Redis/MySQL 是被观察目标，不是 RootSight 自身依赖；目标宕机时 Agent 仍应保持健康并完成诊断。
    redis:
      enabled: false
    db:
      enabled: false

server:
  # 使用独立端口，避免与常见的 8080 业务服务端口冲突。
  port: ${ROOTSIGHT_SERVER_PORT:8081}
