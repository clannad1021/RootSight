services:
  loki-init:
    image: alpine:3.22
    user: "0"
    command:
      - sh
      - -c
      - chown -R 10001:10001 /tmp/loki
    volumes:
      - loki-data:/tmp/loki
    restart: "no"

  loki:
    image: grafana/loki:3.7.2
    user: "10001:10001"
    command:
      - -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    volumes:
      - ./loki/local-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/tmp/loki
    depends_on:
      loki-init:
        condition: service_completed_successfully
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.18.0
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      ROOTSIGHT_OBSERVED_SERVICE: ${ROOTSIGHT_OBSERVED_SERVICE:-observed-target}
    ports:
      - "12345:12345"
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      # 采集目录由部署侧指定；默认仍是 RootSight 自带的通用 observed-logs 目录。
      - ${ROOTSIGHT_OBSERVED_LOG_PATH:-../observed-logs}:/var/log/observed:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      - loki
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.13.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    ports:
      - "9090:9090"
    volumes:
      # 主配置保持通用，具体被观测地址放在 file_sd 目标文件中。
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/targets:/etc/prometheus/targets:ro
      - prometheus-data:/prometheus
    extra_hosts:
      # Linux Docker 环境也可使用与 Docker Desktop 一致的宿主机名称。
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.18.2
    ports:
      # 仅绑定本机；6333 用于健康检查/UI，Spring AI Java 客户端使用 6334 gRPC。
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      # Windows 下使用 Docker 命名卷，避免宿主 bind mount 的文件系统兼容问题。
      - qdrant-data:/qdrant/storage
    restart: unless-stopped

volumes:
  loki-data:
  alloy-data:
  prometheus-data:
  qdrant-data:
